version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: taskdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persists data across restarts
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # seeds on first run
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: taskapi
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # waits for Postgres to be ready

volumes:
  postgres_data:   # named volume = data survives container restarts
